<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Waleed Yagoub</title>
  <meta name="description" content="Waleed Yagoub — robot learning research at the University of Washington. Explore the site as a little world." />
  <meta property="og:title" content="Waleed Yagoub" />
  <meta property="og:description" content="Robot learning research at the University of Washington." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' fill='%23ededed' text-anchor='middle'%3EWY%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #000;
      --text: #ededed;
      --muted: #8f8f8f;
      --faint: #5e5e5e;
      --line: #1f1f1f;
      --raised: #141414;
      --rail: 64px;
      --panel: 440px;
    }
    :root[data-theme="light"] {
      --bg: #f3efe7;
      --text: #1d1b18;
      --muted: #6f6a62;
      --faint: #a39d93;
      --line: #e1dbcf;
      --raised: #e7e1d5;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    body { font: 15px/1.55 "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }

    /* ---------- Rail ---------- */
    #rail {
      position: fixed; z-index: 10; left: 0; top: 0; bottom: 0; width: var(--rail);
      display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0 16px;
      background: var(--bg); border-right: 1px solid var(--line);
    }
    #rail-sections, #rail-tools { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    #rail-sections { margin-top: 10px; }
    .rail-spacer { flex: 1; }
    .rail-btn {
      position: relative; width: 40px; height: 40px; display: grid; place-items: center;
      border: 0; border-radius: 10px; background: none; color: var(--muted); cursor: pointer;
      text-decoration: none; transition: color .15s, background .15s;
    }
    .rail-btn svg { width: 18px; height: 18px; }
    .rail-btn:hover, .rail-btn.on { color: var(--text); background: var(--raised); }
    .rail-btn .tip {
      position: absolute; left: 50px; top: 50%; transform: translate(-4px, -50%);
      padding: 4px 8px; border-radius: 6px; white-space: nowrap; font-size: 13px;
      background: #161616; border: 1px solid #2a2a2a; color: var(--text);
      opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s;
    }
    .rail-btn:hover .tip { opacity: 1; transform: translate(0, -50%); }
    #rail-home { width: 40px; height: 40px; padding: 0; }
    #rail-home:hover, #rail-home.on { background: none; }
    .avatar { display: block; width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: #e9e4da; }
    .avatar img { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    #rail-home.on .avatar { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px #3a3a3a; }

    /* season picker: a row of icons that opens beside the rail */
    .season-wrap { position: relative; }
    .flyout {
      position: absolute; left: 50px; top: 50%; transform: translateY(-50%); z-index: 20;
      display: flex; gap: 2px; padding: 4px; border-radius: 12px;
      background: var(--bg); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
    }
    .flyout[hidden] { display: none; }
    .flyout-btn {
      width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 8px;
      background: none; color: var(--muted); cursor: pointer; transition: color .15s, background .15s;
    }
    .flyout-btn svg { width: 18px; height: 18px; }
    .flyout-btn:hover, .flyout-btn.on { color: var(--text); background: var(--raised); }

    /* light mode: the few colours that aren't variables */
    [data-theme="light"] .rail-btn .tip { background: #fbf9f4; border-color: var(--line); }
    [data-theme="light"] .pill { background: #fbf9f4; border-color: var(--line); }
    [data-theme="light"] .pill:hover { background: var(--raised); border-color: #cfc7b8; }
    [data-theme="light"] .pill.primary { color: #fbf9f4; }
    [data-theme="light"] .pill.primary:hover { background: #000; }
    [data-theme="light"] .label, [data-theme="light"] .chip, [data-theme="light"] .bubble { background: rgba(251, 249, 244, .88); border-color: var(--line); }
    [data-theme="light"] .label:hover, [data-theme="light"] .label.active { color: #fbf9f4; }
    [data-theme="light"] .bubble kbd { border-color: #b9b2a6; }
    [data-theme="light"] .shade { background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 48%, rgba(243, 239, 231, .6) 100%); }
    [data-theme="light"] #rail-home.on .avatar { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px #b9b2a6; }
    [data-theme="light"] #panel { scrollbar-color: #cfc7b8 transparent; }

    /* ---------- Panel ---------- */
    #panel {
      position: fixed; left: var(--rail); top: 0; bottom: 0; width: var(--panel);
      overflow-y: auto; padding: 88px 28px 64px 24px;
      scrollbar-width: thin; scrollbar-color: #2a2a2a transparent;
    }
    #panel.in > * { animation: rise .35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }

    .avatar.big { width: 32px; height: 32px; margin-bottom: 18px; }
    .intro p { margin: 0; font-size: 20px; line-height: 1.4; letter-spacing: -.01em; }
    .intro { margin-bottom: 40px; }

    .section-list { list-style: none; margin: 0; padding: 0; }
    .section-list li { margin: 0 0 10px; }
    .section-list a { font-size: 17px; text-decoration: none; color: var(--muted); }
    .section-list a:hover { color: var(--text); }
    .home-section { margin-bottom: 32px; }
    .home-section h2 { margin: 0 0 10px; font-size: 13px; font-weight: 500; color: var(--muted); }
    .home-section h2 a { text-decoration: none; }
    .home-section h2 a:hover { color: var(--text); }

    .items { list-style: none; margin: 0; padding: 0; }
    .items li { margin: 0 0 14px; }
    .items a { display: block; text-decoration: none; }
    .item-title { font-weight: 500; }
    .item-tag { color: var(--muted); }
    .item-sum { display: block; margin-top: 2px; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .items a:hover .item-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--faint); }
    .empty { color: var(--muted); }
    .meta strong, .item-sum strong, .facts strong { font-weight: 600; color: var(--text); }

    .back { display: inline-block; margin-bottom: 28px; font-size: 13px; color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--text); }
    .title { margin: 0; font-size: 34px; line-height: 1.12; font-weight: 500; letter-spacing: -.025em; }
    .meta { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
    .lede { margin: 14px 0 28px; color: var(--muted); }
    .title + .items { margin-top: 26px; }

    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 16px;
      border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none;
      background: #0b0b0b; border: 1px solid #2d2d2d; color: var(--text); transition: background .15s, border-color .15s;
    }
    .pill:hover { background: #161616; border-color: #3a3a3a; }
    .pill.primary { background: var(--text); color: #000; border-color: var(--text); }
    .pill.primary:hover { background: #fff; }
    .pill .arrow { width: 12px; height: 12px; }

    .facts { margin: 24px 0 0; }
    .facts div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
    .facts div:last-child { border-bottom: 1px solid var(--line); }
    .facts dt { color: var(--muted); }
    .facts dd { margin: 0; text-align: right; }

    .body { margin-top: 26px; }
    .body p { margin: 0 0 16px; font-size: 17px; line-height: 1.7; }
    .body h3 { margin: 30px 0 10px; font-size: 19px; font-weight: 500; letter-spacing: -.01em; }
    .body h3:first-child { margin-top: 0; }

    /* ---------- World ---------- */
    #stage { position: fixed; top: 0; right: 0; bottom: 0; left: calc(var(--rail) + var(--panel)); overflow: hidden; }
    #stage canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .vignette {
      position: absolute; inset: 0; pointer-events: none;
      -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
      -webkit-mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, transparent 42%, #000 100%);
              mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, transparent 42%, #000 100%);
    }
    .shade { position: absolute; inset: 0; pointer-events: none;
             background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 48%, rgba(0, 0, 0, .55) 100%); }
    #labels { position: absolute; inset: 0; pointer-events: none; }
    .label {
      position: absolute; left: 0; top: 0;
      padding: 3px 9px; border-radius: 6px; border: 1px solid #2d2d2d;
      background: rgba(0, 0, 0, .78); color: var(--text);
      font: 14px/1.2 "Pixelify Sans", monospace; white-space: nowrap;
      pointer-events: none; cursor: pointer; opacity: 0; transition: opacity .15s, background .2s, color .2s, border-color .2s;
    }
    .label.show { opacity: 1; }
    .label:hover, .label.active { background: var(--text); color: #000; border-color: var(--text); }
    .chip {
      position: absolute; padding: 6px 12px; border-radius: 999px; font: 13px/1.2 "Geist", sans-serif;
      background: rgba(0, 0, 0, .78); color: var(--text); border: 1px solid #2d2d2d;
    }
    #overview { top: 16px; right: 16px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .3s; }
    #overview.show { opacity: 1; pointer-events: auto; }
    #hint { left: 50%; bottom: 22px; transform: translateX(-50%); pointer-events: none; transition: opacity .6s; white-space: nowrap; color: var(--muted); }
    #hint.hide { opacity: 0; }
    #coords { left: 16px; top: 16px; pointer-events: none; font: 12px/1.5 ui-monospace, monospace; border-radius: 8px; white-space: pre; color: var(--muted); }
    #coords[hidden] { display: none; }
    .you-pointer {
      position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
      background: #e9e4da; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px #3a3a3a, 0 4px 14px rgba(0, 0, 0, .4);
      pointer-events: auto; opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s;
    }
    .you-pointer.show { opacity: 1; visibility: visible; }
    .you-pointer img { display: block; width: 100%; height: 100%; border-radius: 50%; image-rendering: pixelated; }
    .you-arrow {
      position: absolute; left: 50%; top: 50%; width: 0; height: 0; margin: -7px 0 0 -5px;
      border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 10px solid var(--text);
      transform-origin: 5px 7px;
    }
    .bubble {
      position: absolute; left: 0; top: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid #2d2d2d;
      background: rgba(0, 0, 0, .82); color: var(--text); pointer-events: none; transition: opacity .5s; white-space: nowrap;
    }
    .bubble::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 8px; height: 8px; margin-left: -4px;
                     background: inherit; border-right: 1px solid #2d2d2d; border-bottom: 1px solid #2d2d2d; transform: rotate(45deg); }
    .bubble.hide { opacity: 0; }
    .bubble kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 4px;
                  border: 1px solid #555; border-bottom-width: 2px; font: 12px/1 "Geist", sans-serif; color: var(--text); }
    .bubble .arrows { display: grid; grid-template-columns: repeat(3, 20px); gap: 2px; }
    .bubble .arrows kbd { padding: 0; }
    #loader { position: absolute; inset: 0; z-index: 5; display: grid; place-content: center; justify-items: center; gap: 16px; background: var(--bg); transition: opacity .6s ease .1s, visibility .6s .1s; }
    #loader.done { opacity: 0; visibility: hidden; }
    .pixring { position: relative; width: 44px; height: 44px; }
    .pixring i { position: absolute; width: 4px; height: 4px; background: var(--text); opacity: 0; will-change: opacity; animation: pixtail 0.7s linear infinite; }
    @keyframes pixtail { 0% { opacity: 1; } 8% { opacity: .55; } 30% { opacity: .12; } 45%, 100% { opacity: 0; } }
    #loader p { margin: 0; font: 13px/1 "Pixelify Sans", monospace; letter-spacing: .04em; color: var(--muted); }
    #loader p span { animation: pixdot 1.2s steps(1) infinite; }
    #loader p span:nth-child(2) { animation-delay: .2s; }
    #loader p span:nth-child(3) { animation-delay: .4s; }
    @keyframes pixdot { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }
    #webgl-error { display: none; position: absolute; inset: 0; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

    /* ---------- Phones: village on top, tabs, then the panel ---------- */
    @media (max-width: 820px) {
      html, body { height: auto; overflow-x: hidden; }
      body { overflow: auto; display: flex; flex-direction: column; }
      #stage { position: relative; left: 0; height: 32vh; height: 32svh; flex: none; order: 1; }
      #rail { order: 2; flex: none; }
      #panel { order: 3; flex: none; }
      #rail { position: sticky; top: 0; bottom: auto; width: 100%; height: auto; flex-direction: row; justify-content: space-between;
              padding: 6px 8px; border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
      .rail-btn, #rail-home { width: 34px; height: 34px; }
      #rail-sections, #rail-tools { gap: 2px; }
      #stage canvas { touch-action: pan-y; }
      #hint.mobile { top: auto; bottom: 8px; padding: 4px 10px; font-size: 11px; pointer-events: auto; cursor: pointer; white-space: nowrap; }
      .shade { display: none; }
      #overview, .vignette { display: none; }
      #rail-sections, #rail-tools { flex-direction: row; margin: 0; }
      .flyout { position: fixed; left: auto; right: 8px; top: auto; bottom: auto; transform: none; }
      .rail-spacer { display: none; }
      .rail-btn .tip { display: none; }
      #panel { position: static; width: auto; padding: 28px 18px 48px; overflow: visible; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

    <div id="rail-sections"></div>
    <div class="rail-spacer"></div>
    <div id="rail-tools">
      <a class="rail-btn" href="classic.html" aria-label="Simple version">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
        <span class="tip">Simple version</span>
      </a>
    </div>
  </nav>

nimation-delay:-0.099s"></i><i style="left:4px;top:8px;animation-delay:-0.082s"></i><i style="left:4px;top:4px;animation-delay:-0.069s"></i><i style="left:8px;top:4px;animation-delay:-0.057s"></i><i style="left:12px;top:4px;animation-delay:-0.041s"></i><i style="left:12px;top:0px;animation-delay:-0.033s"></i><i style="left:16px;top:0px;animation-delay:-0.017s"></i></div><p>Building the world<span>.</span><span>.</span><span>.</span></p></div>
    <div id="labels"></div>
    <button id="overview" class="chip">Overview</button>
    <div id="coords" class="chip" hidden></div>
    <div id="hint" class="chip">Click to walk &middot; scroll to zoom &middot; WASD &middot; Space to jump</div>

  </main>

  <aside id="panel" aria-live="polite"></aside>

  <script type="importmap">{ "imports": {

  <script type="module" src="app.js"></script>
</body>
